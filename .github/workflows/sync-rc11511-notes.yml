name: Synchroniser les notes de la Release 1.15.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-rc11511-notes.yml'
      - 'RELEASE-NOTES-v1.15.0-pre-rc1.15.11.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copier les notes détaillées dans la Release publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.15.0-pre-rc1.15.11 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit v1.15.0-pre-rc1.15.11 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE-NOTES-v1.15.0-pre-rc1.15.11.md
          echo "Notes de publication synchronisées."
